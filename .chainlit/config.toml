[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["*"]

[features]
unsafe_allow_html = true
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = false

[features.slack]
reaction_on_message_received = false

[features.spontaneous_file_upload]
    enabled = true
    accept = ["*/*"]
    max_files = 20
    max_size_mb = 500

[features.audio]
    enabled = false
    sample_rate = 24000

[features.mcp]
    enabled = false

[UI]
name = "Puls-Events"
logo_file_url = "https://ljhiexubtgighdhahgpg.supabase.co/storage/v1/object/public/public-assets/logo.png"
default_avatar_file_url = "https://ljhiexubtgighdhahgpg.supabase.co/storage/v1/object/public/public-assets/logo.png"
login_page_image = "https://ljhiexubtgighdhahgpg.supabase.co/storage/v1/object/public/public-assets/logo.png"
default_theme = "dark"
language = "fr-FR"
default_sidebar_state = "open"
confirm_new_chat = false
cot = "full"
alert_style = "classic"
custom_css = "https://ljhiexubtgighdhahgpg.supabase.co/storage/v1/object/public/public-assets/custom.css"

[meta]
generated_by = "2.11.1"